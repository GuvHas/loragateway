name: Build Firmware Artifact

# Builds the flashable images on every pull request and push to main. On main
# they are also published to the "firmware-latest" GitHub release, whose
# download links work without signing in to GitHub.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core and esptool
        run: pip install platformio "esptool==4.8.1"

      - name: Build firmware
        run: pio run -e ttgo-lora32-v21

      - name: Package images
        run: python .github/scripts/package_firmware.py ttgo-lora32-v21

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish firmware-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          gh release delete firmware-latest --yes --cleanup-tag || true
          gh release create firmware-latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Latest firmware ($short_sha)" \
            --notes "Built automatically from \`$short_sha\` on main.

          - \`firmware.bin\`: update a board that already runs this project (flash at 0x10000, or upload over OTA).
          - \`firmware-full.bin\`: everything for a blank or erased board, or after a partition table change (flash at 0x0).
          - \`flash-offsets.txt\`: what is inside \`firmware-full.bin\`."
