; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-lora32-v21]
; Pinned so a fresh install builds what was tested. 8.0.0 ships Arduino core
; 3.x (ESP-IDF 5); main.cpp's setupWatchdog() handles its watchdog API. Until
; 2026-11 the pin was 7.1.3 (Arduino core 2.0.17). Bump deliberately and test
; on the board.
platform = espressif32 @ 8.0.0
board = ttgo-lora32-v21
; Arduino core 3.x makes the image ~1.5 MB, over the 1.25 MB app slot in the
; default partition table. min_spiffs keeps two OTA slots (1.9 MB each) and NVS
; at the same offset (Preferences survive), and shrinks SPIFFS, which nothing
; uses. A partition table change can only be flashed over USB, not OTA.
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/inject_git_version.py
build_flags =
	-std=gnu++17
build_unflags =
	-std=gnu++11
lib_deps =
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.4.0
	knolleary/PubSubClient @ ^2.8
	sandeepmistry/LoRa@^0.8.0
    https://github.com/tzapu/WiFiManager.git
	bblanchon/ArduinoJson @ ^6.21.3

; Off-target (native) environment for pure-logic unit tests. Not part of the
; firmware image: `pio run -e ttgo-lora32-v21` (what CI builds) never touches
; this env, and this env excludes main.cpp (the hardware entry point) and
; hal_esp32.cpp (the Arduino/LoRa/PubSubClient/Preferences/SSD1306 adapters,
; unavailable off-target), so it is only meaningful via `pio test -e native`,
; not `pio run -e native`.
;
; Deliberately does NOT run scripts/inject_git_version.py: the real git hash
; has no test-relevant meaning here, and payload_parser.cpp's GATEWAY_FW_VERSION
; falls back to "dev" when it isn't injected, so tests assert the field is
; merely present/non-empty rather than any specific value.
[env:native]
platform = native
build_flags =
	-std=gnu++17
	-D UNIT_TEST_NATIVE
build_src_filter =
	+<*>
	-<main.cpp>
	-<hal_esp32.cpp>
test_build_src = true
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.3
test_framework = unity